model:
  d_model: 512
  n_layers: 8
  n_heads: 8
  vocab_size: 32000
  use_moe: true
  num_experts: 4
  top_k: 2
  expert_hidden: 1024
  num_shared_experts: 1
  use_rex: false
  use_diff_attn: true
  use_mla: false
  max_ctx_len: 1024
  rope_theta: 10000.0
  use_qk_norm: true
  use_per_head_gating: true
  use_value_residuals: true
  use_bitlinear: true
  use_bitnet_a48: true
  bitnet_activation_bits: 8
  a48_attn_topk_sparsity: 0.5
  a48_two_stage_training: true
  a48_stage1_steps_ratio: 0.95
  a48_stage1_bits: 8
  a48_stage2_bits: 4
  a48_use_relu2_glu: true
  use_kda: true
  kda_use_rope: false
  use_attn_res: true
  attn_res_mode: block
  attn_res_num_blocks: 4
  use_mtp: true
  num_mtp_heads: 1
  loss_mtp1_weight: 0.3
  use_muon: true
  muon_nesterov: true
  muon_ns_steps: 5
  muon_momentum: 0.95
  learning_rate: 0.001
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  max_grad_norm: 1.0
  init_std: 0.02
  use_mup_init: true
  tied_embeddings: true
  router_z_loss_coef: 0.001
  router_entropy_coef: 0.001
  label_smoothing: 0.05
training:
  batch_size: 32
  grad_accum_steps: 2
  seq_len: 512
  total_steps: 6000
  use_chinchilla_steps: false
  curriculum_start_seq_len: 256
  curriculum_warmup_ratio: 0.05
  warmup_ratio: 0.05
  checkpoint_every: 1000
  checkpoint_keep_top_k: 3
  checkpoint_dir: checkpoints/run_night_smart
  log_every: 20
  log_dir: logs
  data_dir: data/tokenized
  val_data_dir: data/tokenized
  num_workers: 0
  prefetch_factor: 4
  vram_warn_pct: 88.0
  vram_critical_pct: 95.0
  max_batch_reductions: 4
  min_batch_size: 8
  use_f16: true
  compile: true
  bos_id: 1
  eos_id: 2
  pad_id: 0
  ignore_index: -100
  use_gradient_checkpointing: true
