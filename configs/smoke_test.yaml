model:
  d_model: 256
  n_layers: 4
  n_heads: 4
  vocab_size: 26000
  num_experts: 4
  top_k: 2
  expert_hidden: 256
  use_moe: true
  use_rex: true
  rex_reuse_weight: 0.3
  num_shared_experts: 1
  kda_use_rope: true
  kda_double_gate: false
  use_expert_choice: false
  expert_choice_capacity: 0
  use_diff_attn: true
  use_mla: false
  mla_latent_dim: 64
  use_qk_norm: true
  use_per_head_gating: false
  use_value_residuals: false
  rope_theta: 10000.0
  max_ctx_len: 4096
  sliding_window_size: 512
  lambda_init: 0.8
  use_mamba: true
  mamba_d_state: 64
  mamba_d_conv: 4
  mamba_expand: 2
  attn_every_n_layers: 2
  use_kda: true
  kda_use_parallel_scan: false
  kda_gate_dim: 8
  use_mhc: false
  mhc_n: 2
  mhc_iterations: 3
  num_clr_tokens: 4
  use_mtp: false
  mtp1_warmup_steps: 1500
  mtp2_warmup_steps: 3000
  num_mtp_heads: 2
  use_skip_gram: false
  skip_gram_range: 3
  skip_gram_weight: 0.05
  init_std: 0.02
  depth_scaled_init: true
  router_z_loss_coef: 0.001
  router_entropy_coef: 0.001
  attn_z_loss_coef: 0.0001
  loss_mtp1_weight: 0.3
  loss_mtp2_weight: 0.1
  label_smoothing: 0.05
  use_bitlinear: false
  bitnet_activation_bits: 8
  use_f16: true
  use_grouped_gemm: false
  bitlinear_lm_head: false
  bitlinear_mtp: false
  bitnet_init_std: 0.001
  use_quantized_kv_cache: false
  kv_cache_bits: 3
  use_fp4: false
  use_bitnet_a48: false
  a48_attn_topk_sparsity: 0.5
  a48_use_relu2_glu: true
  a48_two_stage_training: false
  a48_stage1_steps_ratio: 0.95
  a48_stage1_bits: 8
  a48_stage2_bits: 4
  use_muon: false
  muon_nesterov: true
  muon_ns_steps: 1
  muon_min_dim: 256
  muon_momentum: 0.95
  learning_rate: 1.5e-3
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  max_grad_norm: 1.0
  ema_decay: 0.999
  ema_vram_threshold: 0.45
  vram_warn_pct: 88.0
  vram_critical_pct: 95.0
  max_batch_reductions: 3
  min_batch_size: 1
  vram_safety_factor: 0.75
  vram_overhead_mb: 3072.0
  vram_overhead_factor: 1.35

training:
  seq_len: 128
  batch_size: 2
  grad_accum_steps: 1
  total_steps: 3
  warmup_ratio: 0.01
  use_lr_cooldown: false
  lr_cooldown_ratio: 0.05
  use_mtp_cooldown: false
  mtp_cooldown_ratio: 0.15
  mtp_end_scale: 0.1
  curriculum_warmup_ratio: 0.0
  curriculum_start_seq_len: 64
  checkpoint_every: 2
  checkpoint_keep_top_k: 2
  checkpoint_dir: "checkpoints/smoke_test"
  log_every: 1
  eval_every: 0
  eval_max_batches: 2
  dropout: 0.0
  label_smoothing: 0.05
  gradient_noise: 0.0
  stochastic_depth_prob: 0.0
  data_dir: "data/tokenized"
  log_dir: "logs/smoke_test"
  num_workers: 0
  prefetch_factor: 2
  use_f16: true
  use_gradient_checkpointing: true
  generate_max_new_tokens: 10
  generate_top_k: 50
  generate_temperature: 0.8
  chunk_size: 8192
  auto_chunked_ce_threshold: 50000
  ignore_index: -100
  bos_id: 1
  eos_id: 2
  pad_id: 0
