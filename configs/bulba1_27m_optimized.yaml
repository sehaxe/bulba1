model:
  # ── Core Architecture (27M params, optimized for RTX 5060 Ti) ──
  d_model: 512
  n_layers: 12
  n_heads: 8
  vocab_size: 26000
  
  # ── Attention: Pure DiffAttention with MLA (fast, no sequential loops) ──
  use_diff_attn: true
  use_mla: true
  mla_latent_dim: 64
  use_qk_norm: true
  use_per_head_gating: true
  rope_theta: 10000.0
  max_ctx_len: 4096
  
  # ── DISABLED (kills speed on small models) ──
  use_kimi_linear: false    # Sequential loop = death for GPU
  use_mamba: false          # Requires CUDA kernel
  use_kda: false            # Sequential loop = death
  
  # ── MoE: 4 experts (MegaBlocks-style, dropless) ──
  use_moe: true
  num_experts: 4
  top_k: 2
  expert_hidden: 1024
  num_shared_experts: 1
  use_rex: false
  
  # ── MTP-2 (from DeepSeek-V3) ──
  use_mtp: true
  num_mtp_heads: 2
  loss_mtp1_weight: 0.5
  loss_mtp2_weight: 0.5
  mtp1_warmup_steps: 500
  mtp2_warmup_steps: 1500
  
  # ── Attention Residuals (block mode for 12 layers) ──
  use_attn_res: true
  attn_res_mode: "block"
  attn_res_num_blocks: 4
  
  # ── BitNet a4.8 (hybrid quantization from arXiv:2411.04965) ──
  use_bitlinear: true
  use_bitnet_a48: true
  bitnet_activation_bits: 8           # Stage 1: 8-bit
  a48_two_stage_training: true        # 8-bit → 4-bit
  a48_stage1_steps_ratio: 0.95        # 95% at 8-bit
  a48_stage1_bits: 8
  a48_stage2_bits: 4
  a48_use_relu2_glu: true             # ReLU² GLU for sparsity
  a48_attn_topk_sparsity: 0.5         # Top-50% sparsification
  
  # ── Optimizer: Muon with RMS scaling (arXiv:2502.16982) ──
  use_muon: true
  muon_nesterov: true
  muon_ns_steps: 5                    # 5 Newton-Schulz iterations
  muon_momentum: 0.95
  learning_rate: 0.001
  weight_decay: 0.1                   # CRITICAL for Muon stability
  max_grad_norm: 1.0
  
  # ── Regularization ──
  dropout: 0.05
  stochastic_depth_prob: 0.1
  gradient_noise: 3e-5
  
  # ── Disabled features (not needed for 27M) ──
  use_mixture_of_depths: false
  use_token_merging: false
  num_clr_tokens: 0
  use_skip_gram: false

training:
  # ── Batch size (optimized for 16GB VRAM) ──
  batch_size: 48
  grad_accum_steps: 2                 # Global batch = 96
  seq_len: 512
  
  # ── Curriculum (128 → 512 tokens) ──
  curriculum_warmup_ratio: 0.1
  curriculum_start_seq_len: 128
  
  # ── Total steps (Chinchilla optimal for 27M) ──
  total_steps: 50000                  # ~2.4B tokens
  
  # ── Performance optimizations ──
  use_gradient_checkpointing: false   # -20% speed, +30% VRAM
  compile: true                       # torch.compile = +30-50% speed
  
  # ── Logging (minimal overhead) ──
  log_every: 100
  eval_every: 1000
  gen_every: 5000
  checkpoint_every: 2000
  
  # ── Precision ──
  use_f16: true
  use_quantized_kv_cache: true
  kv_cache_bits: 3
  
  # ── YaRN context extension (applied after training) ──
  # Train at 4K, extend to 32K with YaRN
