model:
  d_model: 768
  n_layers: 16
  n_heads: 12
  vocab_size: 32000
  alternating_pattern:
  - attn
  - attn
  - linear
  - attn
  - attn
  - linear
  use_diff_attn: true
  use_mla: true
  mla_latent_dim: 64
  use_qk_norm: true
  use_per_head_gating: true
  rope_theta: 10000.0
  max_ctx_len: 262144
  use_kimi_linear: true
  kimi_local_window: 1024
  kimi_gate_dim: 16
  kimi_double_gate: true
  kimi_use_rope: true
  use_attn_res: true
  attn_res_mode: full
  attn_res_recency_bias_init: 10.0
  use_moe: true
  num_experts: 8
  top_k: 2
  expert_hidden: 1536
  num_shared_experts: 2
  use_mtp: true
  num_mtp_heads: 4
  loss_mtp1_weight: 0.4
  loss_mtp2_weight: 0.3
  loss_mtp3_weight: 0.2
  loss_mtp4_weight: 0.1
  mtp1_warmup_steps: 1000
  mtp2_warmup_steps: 3000
  mtp3_warmup_steps: 6000
  mtp4_warmup_steps: 10000
  use_bitlinear: true
  use_bitnet_a48: true
  bitnet_activation_bits: 8
  a48_two_stage_training: true
  a48_stage1_steps_ratio: 0.9
  a48_stage1_bits: 8
  a48_stage2_bits: 4
  a48_use_relu2_glu: true
  a48_attn_topk_sparsity: 0.5
  use_mamba: false
  use_kda: false
  use_token_merging: false
  use_skip_gram: false
  num_clr_tokens: 0
  use_muon: true
  muon_nesterov: true
  muon_ns_steps: 3
  learning_rate: 0.001
  weight_decay: 0.1
  max_grad_norm: 1.0
  kimi_chunk_size: 64
training:
  curriculum_warmup_ratio: 0.1
  curriculum_start_seq_len: 256
  seq_len: 4096
  batch_size: 24
  grad_accum_steps: 4
  total_steps: 100000
  checkpoint_every: 1000
  checkpoint_dir: checkpoints/run_bulba1_ultimate
  log_every: 50
  eval_every: 500
  gen_every: 2000
