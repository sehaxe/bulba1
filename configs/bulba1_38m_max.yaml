model:
  d_model: 512
  n_layers: 12
  n_heads: 8
  vocab_size: 26000
  use_diff_attn: true
  use_mla: true
  mla_latent_dim: 64
  use_qk_norm: true
  use_per_head_gating: true
  rope_theta: 10000.0
  max_ctx_len: 4096
  use_kimi_linear: false
  use_mamba: false
  use_kda: false
  use_moe: true
  num_experts: 8
  top_k: 2
  expert_hidden: 1536
  num_shared_experts: 1
  use_rex: false
  use_mtp: true
  num_mtp_heads: 2
  loss_mtp1_weight: 0.5
  loss_mtp2_weight: 0.5
  mtp1_warmup_steps: 500
  mtp2_warmup_steps: 1500
  use_attn_res: true
  attn_res_mode: block
  attn_res_num_blocks: 4
  use_bitlinear: true
  use_bitnet_a48: true
  bitnet_activation_bits: 8
  a48_two_stage_training: true
  a48_stage1_steps_ratio: 0.95
  a48_stage1_bits: 8
  a48_stage2_bits: 4
  a48_use_relu2_glu: true
  a48_attn_topk_sparsity: 0.5
  use_muon: true
  muon_nesterov: true
  muon_ns_steps: 5
  muon_momentum: 0.95
  learning_rate: 0.001
  weight_decay: 0.1
  max_grad_norm: 1.0
  dropout: 0.05
  stochastic_depth_prob: 0.1
  gradient_noise: 3e-5
  use_mixture_of_depths: false
  use_token_merging: false
  num_clr_tokens: 0
  use_skip_gram: false
training:
  batch_size: 72
  grad_accum_steps: 1
  seq_len: 512
  curriculum_warmup_ratio: 0.1
  curriculum_start_seq_len: 256
  total_steps: 50000
  use_gradient_checkpointing: false
  compile: true
  log_every: 100
  eval_every: 1000
  gen_every: 5000
  checkpoint_every: 2000
  use_f16: true
  use_quantized_kv_cache: true
  kv_cache_bits: 3
